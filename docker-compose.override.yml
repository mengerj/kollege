# TEMPORÄR — nur zum Verknüpfen des Linked Device (QR-Scan).
#
# Grund: In MODE=json-rpc hält signal-cli-rest-api die Link-Session nicht offen
# (startLink liefert die URI, finishLink wartet nie auf das Telefon) — das
# Telefon zeigt beim Scannen "Netzwerkfehler", serverseitig bleibt das Log leer.
# In MODE=native startet ein echter `signal-cli link`-Subprozess, der den
# Handshake abschließt.
#
# NACH erfolgreichem Verknüpfen diese Datei LÖSCHEN und neu starten:
#   rm docker-compose.override.yml && docker compose up -d
# Der Bot (SignalChannel) braucht json-rpc für das WebSocket-Streaming.
services:
  signal-cli-rest-api:
    environment:
      - MODE=native
