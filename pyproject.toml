# ─────────────────────────────────────────────────────────────────────────────
# Workspace-Wurzel des Monorepos.
#
# Diese Datei beschreibt KEIN eigenes Python-Paket (kein [project]-Block) —
# sie bündelt nur den uv-Workspace und die Werkzeug-Konfiguration.
# Das eigentliche Paket liegt in apps/agent_client/.
#
# Effekt: alle Kommandos laufen wie bisher aus dem Repo-Wurzelverzeichnis,
#   uv sync            → venv mit allen Workspace-Paketen
#   uv run pytest      → Tests des Agent-Clients
# und relative Pfade wie `.env` oder `data/` bleiben gültig.
# ─────────────────────────────────────────────────────────────────────────────

[tool.uv.workspace]
members = ["apps/agent_client"]

[tool.uv.sources]
kollege = { workspace = true }

[dependency-groups]
dev = [
    "kollege",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
transcription = [
    "faster-whisper>=1.0",
]
signal = [
    "httpx>=0.27",
    "websockets>=13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/agent_client/src", "apps/agent_client/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Deutsche Prosa nutzt legitim „..." und En-Dash – keine Homoglyph-Warnungen.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/agent_client/src", "apps/agent_client/tests"]

[[tool.mypy.overrides]]
# Optionale Dependency-Gruppe — kein Stub im Standard-venv.
module = "faster_whisper"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["httpx", "websockets", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/agent_client/tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: marks tests as slow, require faster-whisper installed (deselect with '-m \"not slow\"')",
    "eval: marks eval-set tests (run with 'pytest -m eval'; --real-llm for actual LLM scoring)",
]

[tool.coverage.run]
source = ["kollege"]
branch = true

[tool.coverage.report]
show_missing = true
